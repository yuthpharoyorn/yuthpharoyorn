<svg
  width="340"
  height="190"
  viewBox="0 0 340 190"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Recent Activity (Last 3 Months)</title>
  <desc id="descId">PR: 12, Commit: 24, Contribution: 36, Grade: A+</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ef4444;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .stat-label {
      font: 600 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #e6edf3;
    }
    .stat-value {
      font: 700 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #ef4444;
    }
    .rank-text {
      font: 800 28px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ef4444;
      animation: scaleInAnimation 0.5s ease-in-out forwards;
    }
    .rank-sub {
      font: 700 10px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #8b949e;
      letter-spacing: 1.5px;
    }
    .icon {
      fill: #ef4444;
      display: block;
    }
    .rank-circle-rim {
      stroke: #ef4444;
      fill: none;
      stroke-width: 5;
      opacity: 0.15;
    }
    .rank-circle {
      stroke: #ef4444;
      stroke-dasharray: 238;
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0.95;
      transform-origin: 255px 115px;
      transform: rotate(-90deg);
      animation: rankAnimation 1s forwards ease-in-out;
    }
    @keyframes rankAnimation {
      from { stroke-dashoffset: 238; }
      to { stroke-dashoffset: 20; }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleInAnimation {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
  </style>

  <!-- Card Background -->
  <rect
    data-testid="card-bg"
    class="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#30363d"
    width="339"
    fill="#0d1117"
  />

  <!-- Title -->
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Recent Activity (Last 3 Months)</text>
  </g>

  <!-- Left Stats Rows -->
  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg x="0" y="0">
      <!-- PR Row -->
      <g transform="translate(0, 10)">
        <g transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
            <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
          </svg>
          <text class="stat-label" x="25" y="12.5">PR:</text>
          <text class="stat-value" x="135" y="12.5" data-testid="prs">12</text>
        </g>
      </g>

      <!-- Commit Row -->
      <g transform="translate(0, 45)">
        <g transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
            <path fill-rule="evenodd" d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/>
          </svg>
          <text class="stat-label" x="25" y="12.5">Commit:</text>
          <text class="stat-value" x="135" y="12.5" data-testid="commits">24</text>
        </g>
      </g>

      <!-- Contribution Row -->
      <g transform="translate(0, 80)">
        <g transform="translate(25, 0)">
          <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
            <path fill-rule="evenodd" d="M11.5 8c0 .87-.19 1.69-.53 2.43a4.5 4.5 0 01-8.41-1.87c.2.04.4.06.61.06 1.34 0 2.52-.64 3.26-1.63.15.42.38.8.68 1.13.66.72 1.6 1.18 2.65 1.18.26 0 .52-.03.77-.08A3.01 3.01 0 0011.5 8zm-3.23-7.56a.75.75 0 00-.98.92c.38 1.12.35 2.19-.07 3.03-.38.75-1.07 1.33-1.92 1.63a4.49 4.49 0 01-1.02-3.13.75.75 0 00-1.28-.52C1.72 3.66 1 5.38 1 7.25a6.5 6.5 0 0012.32 2.82c.43-.88.68-1.87.68-2.92 0-3.14-2.12-5.74-5.07-6.57a.75.75 0 00-.66.16z"/>
          </svg>
          <text class="stat-label" x="25" y="12.5">Contribution:</text>
          <text class="stat-value" x="135" y="12.5" data-testid="contribs">36</text>
        </g>
      </g>
    </svg>
  </g>

  <!-- Right Generous Grade Section -->
  <g data-testid="grade-circle" transform="translate(255, 115)">
    <text x="0" y="-45" class="rank-sub" text-anchor="middle">LEVEL</text>
    <circle class="rank-circle-rim" cx="0" cy="0" r="36" />
    <circle class="rank-circle" cx="0" cy="0" r="36" />
    <text x="0" y="10" class="rank-text" text-anchor="middle">A+</text>
  </g>
</svg>
